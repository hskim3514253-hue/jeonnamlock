<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모바일 청첩장</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .wrap { max-width: 520px; }
    .hero img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; display: block; border: var(--line); box-shadow: var(--shadow); }
    .names { font-family: 'Noto Serif KR', serif; font-size: clamp(2.25rem, 11vw, 3.25rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; margin: 1.25rem 0 0.5rem; }
    .when { font-weight: 700; font-size: 1.125rem; }
    .greeting { white-space: pre-line; font-weight: 600; }
    .acct { border-top: 1px solid var(--rule); padding: 0.75rem 0; }
    .acct:first-of-type { border-top: 0; }
    details > summary { font-weight: 700; cursor: pointer; padding: 0.5rem 0; }
    fieldset { border: 0; margin-bottom: 1rem; }
    legend { font-weight: 700; font-size: 0.875rem; margin-bottom: 0.35rem; }
    .choice { display: flex; gap: 0.5rem; }
    .choice label { flex: 1; margin: 0; }
    .choice input { position: absolute; opacity: 0; }
    .choice span { display: flex; align-items: center; justify-content: center; min-height: 46px; border: var(--line); background: #fff; font-weight: 700; cursor: pointer; }
    .choice input:checked + span { background: #111; color: #fff; }
    .choice input:focus-visible + span { outline: 2px solid #111; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="wrap" id="view"><p class="box">불러오는 중입니다</p></main>

  <script src="common.js"></script>
  <script>
    const slug = new URLSearchParams(location.search).get('s') || '';
    const view = $('#view');
    let data;

    function dday(d) {
      const diff = Math.round((new Date(d + 'T00:00:00') - new Date(new Date().toDateString())) / 86400000);
      return diff > 0 ? `D-${diff}` : diff === 0 ? '오늘' : '';
    }

    function accounts() {
      const coarse = matchMedia('(pointer: coarse)').matches;
      const group = (s) => {
        const list = data.accounts.filter((a) => a.side === s);
        if (!list.length) return '';
        return `<details ${data.accounts.length <= 2 ? 'open' : ''}><summary>${sideName(s)} 측 계좌</summary>
          ${list.map((a) => `<div class="acct">
            <div style="font-weight: 700;">${esc(a.label || a.holder)}</div>
            <div class="num" style="font-weight: 500; margin-bottom: 0.5rem;">${esc(a.bank)} ${esc(a.number)}${a.label && a.holder ? ` (${esc(a.holder)})` : ''}</div>
            <div class="row">
              <button class="btn sm" type="button" data-copy="${esc(a.bank + ' ' + a.number)}">계좌 복사</button>
              ${coarse ? `<a class="btn sm" href="supertoss://send?bank=${encodeURIComponent(a.bank)}&accountNo=${encodeURIComponent(a.number.replace(/-/g, ''))}&origin=qr">토스로 보내기</a>` : ''}
              ${a.kakaoLink ? `<a class="btn sm" href="${esc(a.kakaoLink)}" target="_blank" rel="noopener">카카오페이</a>` : ''}
            </div>
          </div>`).join('')}</details>`;
      };
      return data.accounts.length ? `<section class="box yellow"><h2>마음 전하실 곳</h2>${group('groom')}${group('bride')}</section>` : '';
    }

    function render() {
      const w = data;
      const title = `${w.groom} ♥ ${w.bride} 결혼합니다`;
      document.title = title;
      const place = encodeURIComponent(w.address || w.venue);
      const dd = w.date ? dday(w.date) : '';
      view.innerHTML = `
        ${w.published ? '' : '<p class="box orange" style="font-weight: 700; margin-bottom: 1.25rem;">미리보기입니다. 아직 하객에게는 보이지 않습니다.</p>'}
        <header class="hero">
          ${w.photo ? `<img src="${esc(w.photo)}" alt="${esc(w.groom)}와 ${esc(w.bride)}의 사진">` : ''}
          <h1 class="names">${esc(w.groom)}<br>${esc(w.bride)}</h1>
          <p class="when">${esc(fmtDate(w.date))} ${esc(fmtTime(w.time))} ${dd ? `<span class="tag yellow">${dd}</span>` : ''}</p>
          <p style="font-weight: 600;">${esc(w.venue)}</p>
        </header>
        ${w.greeting || w.groomParents || w.brideParents ? `<section class="box" style="margin-top: 1.5rem;">
          <h2>초대합니다</h2>
          <p class="greeting">${esc(w.greeting)}</p>
          ${w.groomParents ? `<p style="font-weight: 600; margin-top: 1rem;">${esc(w.groomParents)} <strong>${esc(w.groom)}</strong></p>` : ''}
          ${w.brideParents ? `<p style="font-weight: 600;">${esc(w.brideParents)} <strong>${esc(w.bride)}</strong></p>` : ''}
        </section>` : ''}
        ${w.venue || w.address ? `<section class="box cyan">
          <h2>오시는 길</h2>
          <p style="font-weight: 700;">${esc(w.venue)}</p>
          <p style="font-weight: 500; margin-bottom: 0.75rem;">${esc(w.address)}</p>
          <div class="row">
            <a class="btn sm" href="https://map.naver.com/p/search/${place}" target="_blank" rel="noopener">네이버 지도</a>
            <a class="btn sm" href="https://map.kakao.com/link/search/${place}" target="_blank" rel="noopener">카카오맵</a>
            ${w.address ? `<button class="btn sm" type="button" data-copy="${esc(w.address)}">주소 복사</button>` : ''}
          </div>
        </section>` : ''}
        ${accounts()}
        <section class="box pink" id="rsvpBox">
          <h2>참석 여부 알려주기</h2>
          <form id="rsvp">
            <div class="field"><label for="r_name">이름</label><input id="r_name" name="name" type="text" maxlength="30" required autocomplete="name"></div>
            <fieldset><legend>어느 쪽 하객이신가요?</legend><div class="choice">
              <label><input type="radio" name="side" value="groom" checked><span>신랑 측</span></label>
              <label><input type="radio" name="side" value="bride"><span>신부 측</span></label>
            </div></fieldset>
            <fieldset><legend>참석 여부</legend><div class="choice">
              <label><input type="radio" name="attending" value="yes" checked><span>참석합니다</span></label>
              <label><input type="radio" name="attending" value="no"><span>마음만 전합니다</span></label>
            </div></fieldset>
            <div id="going">
              <div class="field"><label for="r_count">참석 인원 (본인 포함)</label><input id="r_count" name="count" type="number" min="1" max="20" value="1" inputmode="numeric"></div>
              <label class="check field"><input type="checkbox" name="meal" checked> 식사합니다</label>
            </div>
            <div class="field"><label for="r_phone">연락처 <span class="muted">(선택, 응답을 고칠 때 본인 확인에 씁니다)</span></label><input id="r_phone" name="phone" type="tel" maxlength="20" autocomplete="tel"></div>
            <div class="field"><label for="r_msg">축하 메시지 <span class="muted">(선택)</span></label><textarea id="r_msg" name="message" maxlength="300"></textarea></div>
            <button class="btn block" type="submit">응답 보내기</button>
          </form>
        </section>
        <button class="btn block" type="button" id="share" style="margin-top: 1.25rem;">청첩장 공유하기</button>
        ${w.planner ? `<p style="text-align: center; font-weight: 600; margin-top: 2rem;">웨딩 플래닝 · ${esc(w.planner.company)}</p>` : ''}`;
    }

    document.addEventListener('click', (e) => {
      const c = e.target.closest('[data-copy]');
      if (c) copyText(c.dataset.copy);
      if (e.target.id === 'share') {
        if (navigator.share) navigator.share({ title: document.title, url: location.href }).catch(() => {});
        else copyText(location.href, '청첩장 주소를 복사했습니다');
      }
    });
    document.addEventListener('change', (e) => {
      if (e.target.name === 'attending') $('#going').hidden = e.target.value === 'no';
    });
    document.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = formData(e.target);
      try {
        await api('POST', `api/i/${slug}/rsvp`, body);
        $('#rsvpBox').innerHTML = `<h2>응답을 전달했습니다</h2><p style="font-weight: 600;">${esc(body.name)}님, ${body.attending === 'no' ? '마음 전해 주셔서 감사합니다.' : '예식장에서 뵙겠습니다. 감사합니다.'}</p>`;
      } catch (err) { toast(err.message); }
    });

    api('GET', 'api/i/' + slug, null, localStorage.getItem('wr_couple'))
      .then((d) => { data = d; render(); })
      .catch((err) => { view.innerHTML = `<div class="box"><h2>청첩장을 열 수 없습니다</h2><p style="font-weight: 500;">${esc(err.message)}</p></div>`; });
  </script>
</body>
</html>
