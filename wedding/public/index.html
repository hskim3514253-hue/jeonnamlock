<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모바일 청첩장과 축의금 장부를 하나로</title>
  <link rel="stylesheet" href="common.css">
</head>
<body>
  <main class="wrap narrow" style="padding-top: 3rem;">
    <p id="ref" class="tag" style="font-size: 0.875rem; margin-bottom: 1rem;" hidden></p>
    <h1>청첩장부터<br>축의금 장부까지<br>한 번에</h1>
    <p style="font-weight: 500; margin: 1rem 0 1.5rem;">청첩장으로 받은 참석 응답이 예식 당일 접수대 명단이 되고, 계좌 송금과 현장 봉투가 한 장부에 모입니다.</p>

    <a id="resume" class="btn block yellow" style="margin-bottom: 1.25rem;" hidden>내 예식 관리로 돌아가기</a>

    <form id="start" class="box">
      <h2>우리 예식 시작하기</h2>
      <div class="grid2">
        <div class="field"><label for="groom">신랑 이름</label><input id="groom" name="groom" type="text" maxlength="20" required autocomplete="off"></div>
        <div class="field"><label for="bride">신부 이름</label><input id="bride" name="bride" type="text" maxlength="20" required autocomplete="off"></div>
      </div>
      <div class="field"><label for="date">예식일 <span class="muted">(나중에 정해도 됩니다)</span></label><input id="date" name="date" type="date"></div>
      <button class="btn block yellow" type="submit">시작하기</button>
      <p class="muted" style="margin-top: 0.75rem;">가입 절차 없이 바로 만들어집니다. 다음 화면의 주소가 관리용 열쇠이니 꼭 보관해 주세요.</p>
    </form>

    <div class="box cyan">
      <h3>웨딩플래너이신가요?</h3>
      <p style="font-weight: 500; margin-bottom: 0.75rem;">소개 링크 하나로 고객을 연결하고 소개 수수료를 정산받으세요.</p>
      <a class="btn" href="planner.html">플래너 페이지로</a>
    </div>
  </main>

  <script src="common.js"></script>
  <script>
    const ref = new URLSearchParams(location.search).get('ref') || '';
    if (ref) {
      api('GET', 'api/ref/' + encodeURIComponent(ref)).then((p) => {
        $('#ref').textContent = `${p.company} ${p.name} 플래너 소개`;
        $('#ref').hidden = false;
      }).catch(() => {});
    }
    const saved = localStorage.getItem('wr_couple');
    if (saved) {
      $('#resume').href = 'couple.html#t=' + saved;
      $('#resume').hidden = false;
    }
    $('#start').addEventListener('submit', async (e) => {
      e.preventDefault();
      try {
        const { adminToken } = await api('POST', 'api/weddings', { ...formData(e.target), ref });
        location.href = 'couple.html#t=' + adminToken;
      } catch (err) { toast(err.message); }
    });
  </script>
</body>
</html>
