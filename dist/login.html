<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>전남열쇠 관리자 로그인</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link rel="stylesheet" href="/login.css">
<script src="/login.js" defer></script>
</head>
<body>
<main class="login">
  <h1>전남열쇠 관리자</h1>
  <p>접수 내용과 사진은 사장님만 확인할 수 있습니다.</p>
  <form id="login-form" autocomplete="on">
    <label for="login-password">관리자 비밀번호</label>
    <input id="login-password" name="password" type="password" autocomplete="current-password" required maxlength="200">
    <p id="login-error" class="login-error" role="alert" hidden></p>
    <button type="submit" id="login-submit">로그인</button>
  </form>
  <button type="button" id="logout" class="login-secondary">이 기기에서 로그아웃</button>
  <a href="/">홈페이지로 돌아가기</a>
</main>
</body>
</html>
